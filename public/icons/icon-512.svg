<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D7A8A" />
      <stop offset="100%" stop-color="#24515E" />
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B94E" />
      <stop offset="100%" stop-color="#E8A83E" />
    </radialGradient>
  </defs>
  <!-- Background with Navy rounded squircle -->
  <rect width="512" height="512" rx="112" fill="#1B2B4B"/>
  
  <!-- Outer Study Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#circleGrad)" stroke-width="28" stroke-dasharray="14 10" opacity="0.4"/>
  
  <!-- Main Collaborative Ring -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#FFFFFF" stroke-width="24"/>
  
  <!-- Orbiting Peer Nodes -->
  <circle cx="256" cy="128" r="28" fill="#3D7A8A" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="366" cy="320" r="28" fill="#3D7A8A" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="146" cy="320" r="28" fill="#3D7A8A" stroke="#FFFFFF" stroke-width="8"/>
  
  <!-- Center Core Focus Dot -->
  <circle cx="256" cy="256" r="42" fill="url(#amberGlow)"/>
  <circle cx="256" cy="256" r="18" fill="#FFFFFF"/>
</svg>
